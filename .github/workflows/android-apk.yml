name: Android APK

# بیلد تکی اندروید (دستی) — پایپ‌لاین خودکار push در release.yml است.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          # در Settings گیت‌هاب مقدار بده، مثلا https://api.doinow.ir/api/v1
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Doinow-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
