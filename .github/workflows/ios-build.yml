name: iOS build (unsigned)

# بیلد iOS بدون امضا روی رانر macOS.
# خروجی: اپ شبیه‌ساز (.app) + تضمین سلامت کامپایل.
# نصب روی آیفون واقعی به حساب Apple Developer و امضا نیاز دارد (فعلا نداریم).

# بیلد تکی iOS (دستی) — پایپ‌لاین خودکار push در release.yml است.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          # در Settings گیت‌هاب مقدار بده، مثلا https://api.doinow.ir/api/v1
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && xcodebuild -version

      # قالب SPM کپسیتور App.xcworkspace ندارد، پس مستقیم با project/target بیلد می‌کنیم.
      - name: Build for Simulator (no signing)
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -target App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build/derivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: Doinow-ios-simulator
          path: client/build/derivedData/Build/Products/Debug-iphonesimulator/App.app
